<!DOCTYPE html>
<html>
<head>
    <title>Register Details</title>
</head>
<body>

<h2>Welcome</h2>

<table border="1" cellpadding="0" cellspacing="0">

<tr>
    <th>ID</th>
    <td>{{ user.id }}</td>
</tr>

<tr>
    <th>Name</th>
    <td>{{ user.name }}</td>
</tr>

<tr>
    <th>Email</th>
    <td>{{ user.email }}</td>
</tr>

<tr>
    <th>Contact</th>
    <td>{{ user.contact }}</td>
</tr>

<tr>
    <th>Gender</th>
    <td>{{ user.gender }}</td>
</tr>

<tr>
    <th>State</th>
    <td>{{ user.state }}</td>
</tr>

<tr>
    <th>Country</th>
    <td>{{ user.country }}</td>
</tr>

</table>

<br>

<button><a href="/logout/">Logout</a></button>

</body>
</html>
